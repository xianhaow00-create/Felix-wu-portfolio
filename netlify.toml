# Netlify config for Felix Wu portfolio (React 18 + Vite 5 SPA)
# Replaces the ephemeral CloudStudio sandbox — Netlify is a real CDN-hosted
# static site, so it stays online permanently (no idle recycling).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for any unknown path so deep links / refresh
# on a sub-route don't 404. (This site is single-page scroll, but this keeps
# direct URLs robust.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed build assets (Vite fingerprints them, so safe to
# cache forever). index.html itself is NOT cached, so deploys show instantly.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic hardening headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
